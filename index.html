<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Oxígeno</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }
        #fondo-radio {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 2s ease-in-out;
            opacity: 1;
            z-index: -1;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        .player-box {
            position: relative;
            z-index: 1;
            background: rgba(20, 20, 20, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            color: #ff5722;
            margin-bottom: 15px;
            font-size: 24px;
            letter-spacing: 2px;
        }
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>
    <div id="fondo-radio"></div>
    <div class="overlay"></div>
    <div class="player-box">
        <h1>RADIO OXÍGENO</h1>
        <audio controls autoplay>
            <source src="https://stream12.hnetwork.net:8002/stream" type="audio/mpeg">
        </audio>
    </div>
    <script>
        const imagenes = ['foto 1.jpg', 'foto 2.jpg', 'foto 3.jpg', 'foto 4.jpg'];
        let index = 0;
        const capaFondo = document.getElementById('fondo-radio');

        function cambiarFondoSuave() {
            capaFondo.style.opacity = 0;
            setTimeout(() => {
                capaFondo.style.backgroundImage = `url('${imagenes[index]}')`;
                capaFondo.style.opacity = 1;
                index = (index + 1) % imagenes.length;
            }, 1000);
        }

        capaFondo.style.backgroundImage = `url('${imagenes[index]}')`;
        index = (index + 1) % imagenes.length;
        setInterval(cambiarFondoSuave, 15 * 60 * 1000);
    </script>
</body>
</html>
