<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Oxígeno - En Vivo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }

    .bg-image {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .player-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px 25px;
      border-radius: 50px;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    audio {
      outline: none;
    }
  </style>
</head>
<body>
  <img src="Gemini_Generated_Image_e1vv9qa1vv8qa1vv.png" alt="Radio Oxígeno" class="bg-image">
  <div class="player-container">
    <audio controls autoplay>
      <source src="https://192.99.16.17:8690/stream" type="audio/mpeg">
      Tu navegador no soporta el reproductor de audio.
    </audio>
  </div>
</body>
</html>
