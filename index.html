
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Radio Oxígeno | En Vivo</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: #08090d;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    color: white;
}

/* FOTOGRAFÍAS */

.fondo {
    position: fixed;
    inset: 0;
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
    transition: opacity 2s ease-in-out;
    z-index: 0;
}

#fondo1 { opacity: 1; }
#fondo2 { opacity: 0; }

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.48);
    z-index: 1;
}

/* RELOJ DIGITAL SUPERIOR IZQUIERDO */

.reloj {
    position: fixed;
    top: 28px;
    left: 32px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 0;
    background: transparent;
}

.digito {
    position: relative;
    width: 37px;
    height: 65px;
}

.seg {
    position: absolute;
    background: #382719;
    opacity: .55;
    transition: background .2s, opacity .2s;
}

.seg.encendido {
    background: #ff9b35;
    opacity: 1;
    filter: drop-shadow(0 0 4px #ff791b)
            drop-shadow(0 0 9px rgba(255,140,35,.65));
}

/* Segmentos horizontales */

.seg.a, .seg.g, .seg.d {
    width: 25px;
    height: 6px;
    left: 6px;
    clip-path: polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);
}

.seg.a { top: 0; }
.seg.g { top: 29px; }
.seg.d { bottom: 0; }

/* Segmentos verticales */

.seg.b, .seg.c, .seg.e, .seg.f {
    width: 6px;
    height: 25px;
    clip-path: polygon(50% 0,100% 12%,100% 88%,50% 100%,0 88%,0 12%);
}

.seg.f { top: 4px; left: 1px; }
.seg.b { top: 4px; right: 1px; }
.seg.e { bottom: 4px; left: 1px; }
.seg.c { bottom: 4px; right: 1px; }

.dos-puntos {
    height: 65px;
    width: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    animation: parpadeo 1s steps(1) infinite;
}

.dos-puntos span {
    width: 6px;
    height: 6px;
    background: #ff9b35;
    border-radius: 1px;
    box-shadow: 0 0 8px #ff791b;
}

@keyframes parpadeo {
    50% { opacity: .15; }
}

.etiqueta-reloj {
    position: fixed;
    top: 101px;
    left: 34px;
    z-index: 5;
    color: #ffad4b;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 2px;
}

/* REPRODUCTOR HORIZONTAL */

.player {
    position: fixed;
    z-index: 3;
    right: 35px;
    top: 50%;
    transform: translateY(-50%);

    width: 760px;
    min-height: 220px;

    padding: 25px 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;

    background: linear-gradient(
        120deg,
        rgba(28,30,37,.97),
        rgba(9,10,15,.97)
    );

    border: 1px solid rgba(255,169,69,.38);
    border-radius: 22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.8),
        0 0 30px rgba(255,115,20,.10);
}

/* IDENTIDAD */

.identidad {
    flex: 1.1;
    min-width: 175px;
}

.marca {
    color: #aaaeb7;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 13px;
}

h1 {
    color: #ffad4b;
    font-size: 27px;
    letter-spacing: 1px;
    margin: 0;
    white-space: nowrap;
}

.subtitulo {
    margin-top: 9px;
    font-size: 9px;
    color: #b7b8c0;
    letter-spacing: 1.5px;
}

.en-vivo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 18px;
    padding: 7px 12px;
    border-radius: 20px;
    color: #ffad4b;
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    background: rgba(255,100,30,.12);
    border: 1px solid rgba(255,130,40,.35);
}

.punto {
    width: 7px;
    height: 7px;
    background: #ff642c;
    border-radius: 50%;
    box-shadow: 0 0 9px #ff642c;
    animation: pulso 1.5s infinite;
}

@keyframes pulso {
    50% { opacity: .3; }
}

/* ECUALIZADOR */

.zona-musica {
    flex: 1;
    text-align: center;
    min-width: 150px;
}

.ecualizador {
    height: 65px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
}

.barra {
    width: 5px;
    height: 9px;
    border-radius: 5px;
    background: linear-gradient(to top,#ff5a20,#ffbe60);
    box-shadow: 0 0 8px rgba(255,110,30,.4);
}

.player.is-playing .barra {
    animation: onda .8s ease-in-out infinite alternate;
}

.player.is-playing .barra:nth-child(2n) {
    animation-duration: .55s;
}

.player.is-playing .barra:nth-child(3n) {
    animation-duration: 1.1s;
}

@keyframes onda {
    from { height: 8px; }
    to { height: 53px; }
}

.estado {
    margin-top: 12px;
    color: #ffad4b;
    font-size: 10px;
    letter-spacing: 1.5px;
    min-height: 14px;
}

/* CONTROLES */

.controles {
    flex: 1;
    min-width: 175px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.play {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.2);
    background: linear-gradient(145deg,#ffc16b,#f47725,#d94b16);
    color: white;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 8px 25px rgba(255,100,20,.35);
    transition: transform .2s;
}

.play:hover { transform: scale(1.08); }

.play:disabled {
    opacity: .7;
    cursor: wait;
}

.accion {
    margin-top: 9px;
    color: #ccc;
    font-size: 9px;
    letter-spacing: 1.5px;
}

.volumen {
    width: 100%;
    margin-top: 17px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: #ffad4b;
}

.volumen input {
    flex: 1;
    min-width: 0;
    accent-color: #ff9a40;
    cursor: pointer;
}

.volumen-valor {
    color: #bbb;
    font-size: 10px;
    min-width: 28px;
    text-align: right;
}

.pie {
    position: absolute;
    right: 29px;
    bottom: 9px;
    color: #85868c;
    font-size: 8px;
    letter-spacing: 1px;
}

.pie strong { color: #ffad4b; }

/* PANTALLAS PEQUEÑAS */

@media (max-width: 850px) {
    body {
        overflow: auto;
    }

    .player {
        width: calc(100% - 30px);
        right: 15px;
        padding: 22px 16px;
        gap: 12px;
    }

    .identidad { min-width: 120px; }
    .controles { min-width: 130px; }
    h1 { font-size: 20px; }
    .subtitulo { font-size: 8px; }
}

@media (max-width: 560px) {
    .reloj {
        top: 18px;
        left: 18px;
        transform: scale(.78);
        transform-origin: top left;
    }

    .etiqueta-reloj {
        top: 72px;
        left: 20px;
    }

    .player {
        top: auto;
        bottom: 22px;
        left: 15px;
        right: 15px;
        transform: none;
        width: auto;
        min-height: 0;
        flex-direction: column;
        gap: 18px;
        padding: 22px 18px 30px;
    }

    .identidad {
        text-align: center;
    }

    .zona-musica { width: 100%; }

    .controles {
        width: 100%;
        max-width: 220px;
    }

    .pie {
        left: 0;
        right: 0;
        text-align: center;
        bottom: 10px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .barra, .punto, .dos-puntos {
        animation: none !important;
    }
}
</style>
</head>

<body>

<!-- FOTOGRAFÍAS -->
<div id="fondo1" class="fondo"></div>
<div id="fondo2" class="fondo"></div>
<div class="overlay"></div>

<!-- RELOJ DIGITAL -->
<div class="reloj" id="reloj" aria-label="Hora de Chile">
</div>

<div class="etiqueta-reloj">
    HORA CHILE
</div>

<!-- REPRODUCTOR -->
<main class="player" id="player">

    <section class="identidad">
        <div class="marca">RADIO DIGITAL</div>

        <h1>RADIO OXÍGENO</h1>

        <div class="subtitulo">
            LA MÚSICA QUE TE ACOMPAÑA
        </div>

        <div class="en-vivo">
            <span class="punto"></span>
            EN VIVO
        </div>
    </section>

    <section class="zona-musica">

        <div class="ecualizador" aria-hidden="true">
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
            <span class="barra"></span>
        </div>

        <div class="estado" id="estado" role="status">
            LISTO PARA ESCUCHAR
        </div>

    </section>

    <section class="controles">

        <button
            class="play"
            id="btnPlay"
            type="button"
            aria-label="Escuchar Radio Oxígeno"
        >
            ▶
        </button>

        <div class="accion" id="accion">
            PULSA PARA ESCUCHAR
        </div>

        <div class="volumen">
            <span aria-hidden="true">◖))</span>

            <input
                type="range"
                id="volumen"
                min="0"
                max="100"
                value="80"
                aria-label="Volumen"
            >

            <span class="volumen-valor" id="valorVolumen">
                80%
            </span>
        </div>

    </section>

    <div class="pie">
        TRANSMISIÓN ONLINE · <strong>CHILE</strong>
    </div>

    <audio id="radio" preload="none" playsinline>
        <source
            src="https://stream13.hcnetwork.net/8002/stream"
            type="audio/mpeg"
        >
    </audio>

</main>

<script>

// =====================================
// RELOJ DIGITAL DE SIETE SEGMENTOS
// =====================================

const reloj = document.getElementById("reloj");

const segmentos = ["a","b","c","d","e","f","g"];

const numeros = {
    0: ["a","b","c","d","e","f"],
    1: ["b","c"],
    2: ["a","b","g","e","d"],
    3: ["a","b","g","c","d"],
    4: ["f","g","b","c"],
    5: ["a","f","g","c","d"],
    6: ["a","f","g","e","c","d"],
    7: ["a","b","c"],
    8: ["a","b","c","d","e","f","g"],
    9: ["a","b","c","d","f","g"]
};

function crearDigito(numero) {

    const digito = document.createElement("div");
    digito.className = "digito";

    segmentos.forEach(function(nombre) {

        const pieza = document.createElement("span");
        pieza.className = "seg " + nombre;

        if (numeros[numero].includes(nombre)) {
            pieza.classList.add("encendido");
        }

        digito.appendChild(pieza);

    });

    return digito;
}

function dibujarReloj() {

    const partes = new Intl.DateTimeFormat("es-CL", {
        timeZone: "America/Santiago",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
    }).formatToParts(new Date());

    const hora = partes.find(p => p.type === "hour").value;
    const minuto = partes.find(p => p.type === "minute").value;

    reloj.innerHTML = "";

    reloj.appendChild(crearDigito(hora[0]));
    reloj.appendChild(crearDigito(hora[1]));

    const dosPuntos = document.createElement("div");
    dosPuntos.className = "dos-puntos";

    const punto1 = document.createElement("span");
    const punto2 = document.createElement("span");

    dosPuntos.appendChild(punto1);
    dosPuntos.appendChild(punto2);

    reloj.appendChild(dosPuntos);

    reloj.appendChild(crearDigito(minuto[0]));
    reloj.appendChild(crearDigito(minuto[1]));

}

// Actualización cada segundo
dibujarReloj();
setInterval(dibujarReloj, 1000);


// =====================================
// REPRODUCTOR SONICPANEL
// =====================================

const radio = document.getElementById("radio");
const boton = document.getElementById("btnPlay");
const estado = document.getElementById("estado");
const accion = document.getElementById("accion");
const player = document.getElementById("player");

async function reproducirRadio() {

    if (!radio.paused) {
        radio.pause();
        return;
    }

    boton.disabled = true;
    estado.textContent = "CONECTANDO...";
    estado.style.color = "#ffad4b";

    try {

        await radio.play();

    } catch (error) {

        estado.textContent = "ERROR DE CONEXIÓN";
        estado.style.color = "#ff6666";
        accion.textContent = "INTENTA NUEVAMENTE";

        console.error("Error de radio:", error);

    } finally {

        boton.disabled = false;

    }
}

boton.addEventListener("click", reproducirRadio);

function actualizarReproductor() {

    if (!radio.paused && !radio.ended) {

        boton.textContent = "Ⅱ";
        boton.setAttribute("aria-label", "Pausar radio");

        estado.textContent = "SONANDO EN VIVO";
        estado.style.color = "#ffad4b";

        accion.textContent = "PAUSAR TRANSMISIÓN";
        player.classList.add("is-playing");

    } else {

        boton.textContent = "▶";
        boton.setAttribute("aria-label", "Escuchar Radio Oxígeno");

        estado.textContent = "TRANSMISIÓN EN PAUSA";
        estado.style.color = "#b9bac0";

        accion.textContent = "PULSA PARA ESCUCHAR";
        player.classList.remove("is-playing");

    }
}

radio.addEventListener("playing", actualizarReproductor);
radio.addEventListener("pause", actualizarReproductor);

radio.addEventListener("waiting", function() {
    estado.textContent = "CARGANDO TRANSMISIÓN...";
    estado.style.color = "#ffad4b";
    player.classList.remove("is-playing");
});

radio.addEventListener("error", function() {
    estado.textContent = "ERROR DE CONEXIÓN";
    estado.style.color = "#ff6666";
    accion.textContent = "REVISA LA TRANSMISIÓN";
    player.classList.remove("is-playing");
});

// CONTROL DE VOLUMEN

const volumen = document.getElementById("volumen");
const valorVolumen = document.getElementById("valorVolumen");

radio.volume = 0.8;

volumen.addEventListener("input", function() {

    radio.volume = Number(volumen.value) / 100;
    valorVolumen.textContent = volumen.value + "%";

});


// =====================================
// ROTACIÓN DE LAS CUATRO FOTOGRAFÍAS
// =====================================

const imagenes = [
    "foto 1.jpg",
    "foto 2.jpg",
    "foto 3.jpg",
    "foto 4.jpg"
];

const fondo1 = document.getElementById("fondo1");
const fondo2 = document.getElementById("fondo2");

let indiceFoto = 0;
let fondoActivo = 1;

fondo1.style.backgroundImage =
    `url("${imagenes[0]}")`;

// Precargar fotografías
imagenes.forEach(function(archivo) {
    const imagen = new Image();
    imagen.src = archivo;
});

function cambiarFotografia() {

    indiceFoto = (indiceFoto + 1) % imagenes.length;

    const siguiente = fondoActivo === 1 ? fondo2 : fondo1;
    const anterior = fondoActivo === 1 ? fondo1 : fondo2;

    siguiente.style.backgroundImage =
        `url("${imagenes[indiceFoto]}")`;

    siguiente.style.opacity = "1";
    anterior.style.opacity = "0";

    fondoActivo = fondoActivo === 1 ? 2 : 1;

}

// Cada 15 minutos
setInterval(cambiarFotografia, 15 * 60 * 1000);

</script>

</body>
</html>
